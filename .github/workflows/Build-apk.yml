name: Build Sonic Scramble APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out port repo
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download game ZIP from v1.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path gamezip | Out-Null

          gh release download v1.0 `
            --repo "${{ github.repository }}" `
            --pattern "*.zip" `
            --dir gamezip

          $zip = Get-ChildItem gamezip -Filter *.zip |
            Select-Object -First 1

          if (-not $zip) {
            throw "No ZIP release asset found."
          }

          Write-Host "Found game ZIP: $($zip.Name)"

      - name: Extract game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null

          $zip = Get-ChildItem gamezip -Filter *.zip |
            Select-Object -First 1

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath game `
            -Force

          $data = Get-ChildItem game -Filter data.win -Recurse |
            Select-Object -First 1

          if (-not $data) {
            throw "data.win was not found in the game ZIP."
          }

          Write-Host "Found data.win: $($data.FullName)"

          "DATA_WIN=$($data.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "GAME_DIR=$($data.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download GameMaker-Mobiler
        shell: pwsh
        run: |
          git clone --recursive --depth 1 `
            https://github.com/znm2500/GameMaker-Mobiler.git `
            mobiler

      - name: Create command-line builder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path mobiler/PortCli | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>

            <ItemGroup>
              <ProjectReference Include="../GameMaker-Mobiler/GameMaker-Mobiler.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content `
            mobiler/PortCli/PortCli.csproj `
            -Encoding UTF8

          @'
          using GameMaker_Mobiler.Services;

          var gameDir =
              Environment.GetEnvironmentVariable("GAME_DIR")
              ?? throw new Exception("GAME_DIR missing");

          var dataWin =
              Environment.GetEnvironmentVariable("DATA_WIN")
              ?? throw new Exception("DATA_WIN missing");

          var output = Path.Combine(
              Path.GetFullPath("."),
              "Sonic-Scramble-Android.apk");

          var version = DataWinVersionReader.Read(dataWin);

          if (!version.IsValid)
              throw new Exception(
                  "Could not read the GameMaker data.win version.");

          Console.WriteLine(
              $"Detected: {version.DisplayVersion}");

          Console.WriteLine(
              "BASELINE TEST: Using original data.win with no mobile modifications.");

          var builder = new ApkBuilder(
              (message, important) =>
                  Console.WriteLine(
                      (important ? "[!] " : "    ") + message));

          var template =
              builder.FindTemplateApk(version);

          Console.WriteLine(
              $"Template: {template}");

          var progress =
              new Progress<(int Percent, string Message)>(
                  p => Console.WriteLine(
                      $"[{p.Percent}%] {p.Message}"));

          await builder.BuildApkAsync(
              template,
              gameDir,
              dataWin,
              output,
              "Sonic Scramble",
              "com.hdsavag3.sonicscramble",
              "1.0.0",
              null,
              null,
              false,
              false,
              progress,
              CancellationToken.None);

          if (!File.Exists(output))
              throw new Exception(
                  "APK build finished without producing an APK.");

          Console.WriteLine(
              $"APK: {output}");
          '@ | Set-Content `
            mobiler/PortCli/Program.cs `
            -Encoding UTF8

      - name: Build command-line builder
        shell: pwsh
        run: |
          dotnet build `
            mobiler/PortCli/PortCli.csproj `
            -c Release

      - name: Stage GameMaker runtime files
        shell: pwsh
        run: |
          $out = Resolve-Path `
            mobiler/PortCli/bin/Release/net9.0-windows

          Copy-Item -Recurse -Force `
            mobiler/'GMS2 APK' `
            $out/'GMS2 APK'

          if (Test-Path mobiler/Tools) {
            Copy-Item -Recurse -Force `
              mobiler/Tools `
              $out/Tools
          }

          $jreDestination = Join-Path `
            $out `
            "Tools\jre"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $jreDestination | Out-Null

          Copy-Item `
            -Recurse `
            -Force `
            "$env:JAVA_HOME\*" `
            $jreDestination

          $java = Join-Path `
            $jreDestination `
            "bin\java.exe"

          if (-not (Test-Path $java)) {
            throw "Java was not staged correctly: $java"
          }

          Write-Host "Java staged successfully:"
          Write-Host $java

      - name: Build APK
        shell: pwsh
        working-directory: mobiler/PortCli/bin/Release/net9.0-windows
        run: |
          ./PortCli.exe

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Sonic-Scramble-Android-Baseline-Test
          path: mobiler/PortCli/bin/Release/net9.0-windows/Sonic-Scramble-Android.apk
